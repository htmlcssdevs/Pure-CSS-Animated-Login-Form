<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusAuth - Pure HTML & CSS Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ambient Glowing Orbs -->
  <div class="ambient-orbs-container">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <div class="bg-mesh-grid"></div>

  <!-- Pure CSS Form Mode Radios (Hidden) -->
  <input type="radio" name="auth-mode" id="mode-signin" class="tab-radio" checked>
  <input type="radio" name="auth-mode" id="mode-signup" class="tab-radio">

  <!-- Main Container -->
  <main class="auth-wrapper">
    <div class="glowing-border-wrap">
      <div class="glass-card">

        <!-- Brand Header -->
        <header class="brand-header">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <path d="M9 12l2 2 4-4"/>
            </svg>
          </div>
          <h1 class="brand-title">NexusPortal</h1>
          <p class="brand-subtitle">
            <span class="subtitle-signin">Sign in to access your secured decentralized workspace.</span>
            <span class="subtitle-signup">Join thousands of creators building the next-gen web.</span>
          </p>
        </header>

        <!-- Pure CSS Sliding Mode Tabs -->
        <nav class="tab-bar" aria-label="Authentication modes">
          <div class="tab-slider-pill"></div>
          <label for="mode-signin" class="tab-label">Sign In</label>
          <label for="mode-signup" class="tab-label">Create Account</label>
        </nav>

        <!-- Social Auth Grid -->
        <div class="social-grid">
          <a href="#google" class="social-btn">
            <svg viewBox="0 0 24 24">
              <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.4l3.7 2.9C6.5 7.4 9 5 12 5z"/>
              <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5.1 3.7-8.8z"/>
              <path fill="#FBBC05" d="M5.6 14.7c-.2-.7-.4-1.5-.4-2.7s.1-2 .4-2.7L1.9 6.4C.7 8.8 0 10.4 0 12s.7 3.2 1.9 5.6l3.7-2.9z"/>
              <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2-6.4-4.8L1.9 16.4C3.7 20.4 7.5 23 12 23z"/>
            </svg>
            Google
          </a>
          <a href="#github" class="social-btn">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
            </svg>
            GitHub
          </a>
        </div>

        <div class="form-divider">
          <span>or continue with email</span>
        </div>

        <!-- Form Panels Viewport -->
        <div class="forms-viewport">
          <div class="forms-track">

            <!-- ================= SIGN IN PANEL ================= -->
            <div class="form-panel panel-signin">
              <form action="#signin-action" method="POST" autocomplete="on">

                <!-- Email Field -->
                <div class="field-group">
                  <div class="input-box">
                    <input type="email" id="signin-email" class="form-input" placeholder=" " required>
                    <label for="signin-email" class="floating-label">Email Address</label>
                  </div>
                </div>

                <!-- Password Field with Pure CSS Show/Hide Hack -->
                <div class="field-group">
                  <input type="checkbox" id="show-pwd-signin" class="pwd-toggle-checkbox">
                  <div class="input-box">
                    <input type="password" id="signin-password" class="form-input has-eye" placeholder=" " required>
                    <label for="signin-password" class="floating-label">Password</label>
                    <label for="show-pwd-signin" class="pwd-toggle-label" title="Toggle password mask">
                      <!-- Open Eye Icon -->
                      <svg class="icon-eye" viewBox="0 0 24 24">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                      </svg>
                      <!-- Closed Eye Icon -->
                      <svg class="icon-eye-off" viewBox="0 0 24 24">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                      </svg>
                    </label>
                  </div>
                </div>

                <!-- Options -->
                <div class="options-row">
                  <label class="custom-checkbox">
                    <input type="checkbox" class="checkbox-input" id="remember-signin" checked>
                    <span class="checkbox-mark">
                      <svg viewBox="0 0 24 24">
                        <polyline points="20 6 9 17 4 12"></polyline>
                      </svg>
                    </span>
                    Remember me
                  </label>
                  <a href="#forgot" class="text-link">Forgot password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit">
                  <span>Sign In</span>
                  <svg viewBox="0 0 24 24">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                  </svg>
                </button>
              </form>
            </div>

            <!-- ================= SIGN UP PANEL ================= -->
            <div class="form-panel panel-signup">
              <form action="#signup-action" method="POST" autocomplete="on">

                <!-- Full Name Field -->
                <div class="field-group">
                  <div class="input-box">
                    <input type="text" id="signup-name" class="form-input" placeholder=" " required>
                    <label for="signup-name" class="floating-label">Full Name</label>
                  </div>
                </div>

                <!-- Email Field -->
                <div class="field-group">
                  <div class="input-box">
                    <input type="email" id="signup-email" class="form-input" placeholder=" " required>
                    <label for="signup-email" class="floating-label">Email Address</label>
                  </div>
                </div>

                <!-- Password Field with Pure CSS Show/Hide Hack -->
                <div class="field-group">
                  <input type="checkbox" id="show-pwd-signup" class="pwd-toggle-checkbox">
                  <div class="input-box">
                    <input type="password" id="signup-password" class="form-input has-eye" placeholder=" " required>
                    <label for="signup-password" class="floating-label">Create Password</label>
                    <label for="show-pwd-signup" class="pwd-toggle-label" title="Toggle password mask">
                      <!-- Open Eye Icon -->
                      <svg class="icon-eye" viewBox="0 0 24 24">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                      </svg>
                      <!-- Closed Eye Icon -->
                      <svg class="icon-eye-off" viewBox="0 0 24 24">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                      </svg>
                    </label>
                  </div>
                </div>

                <!-- Terms Checkbox -->
                <div class="options-row">
                  <label class="custom-checkbox">
                    <input type="checkbox" class="checkbox-input" id="terms-signup" required>
                    <span class="checkbox-mark">
                      <svg viewBox="0 0 24 24">
                        <polyline points="20 6 9 17 4 12"></polyline>
                      </svg>
                    </span>
                    I accept the <a href="#terms" class="text-link" style="margin-left:3px;">Terms of Service</a>
                  </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit">
                  <span>Create Account</span>
                  <svg viewBox="0 0 24 24">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                  </svg>
                </button>
              </form>
            </div>

          </div>
        </div>

        <!-- Footer switch helper -->
        <footer class="card-footer">
          <span class="footer-signin-text">
            Don't have an account yet?
            <label for="mode-signup" class="footer-action-label">Sign up now</label>
          </span>
          <span class="footer-signup-text">
            Already registered?
            <label for="mode-signin" class="footer-action-label">Sign in</label>
          </span>
        </footer>

      </div>
    </div>
  </main>

</body>
</html>
